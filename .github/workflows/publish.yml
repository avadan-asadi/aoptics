name: Publish to PyPI

# Triggered automatically whenever a GitHub Release is published.
# See docs/PUBLISHING.en.md (also .fa.md / .tr.md) for full setup instructions,
# including the one-time Trusted Publishing link between this repo and PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:   # allows a manual re-run from the Actions tab if ever needed

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi   # must match the "Environment name" set on PyPI's Trusted Publisher page
    permissions:
      id-token: write   # required for OIDC Trusted Publishing (no stored secret needed)

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing: no `password`/token input needed once the PyPI project's
        # "Trusted Publishers" settings point at this repo + workflow + environment.
        # To use a classic API token instead, see docs/PUBLISHING.en.md Section 3.3.
